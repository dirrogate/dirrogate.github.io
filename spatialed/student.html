<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>SpatialED student</title>
<style>
  :root { --bg:#0b0d12; --card:#151b26; --line:#2a6f8a; --acc:#39d0ff; --text:#eef3f7; --dim:#8c96a8; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; overflow:hidden; }
  canvas { display:block; touch-action:none; }
  #join { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; z-index:5; background:var(--bg); }
  .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; box-sizing:border-box; }
  h1 { margin:0 0 4px; font-size:22px; } h1 span { color:var(--acc); }
  p { color:var(--dim); font-size:14px; line-height:1.45; margin:6px 0 14px; }
  label { display:block; font-size:13px; color:var(--dim); margin:12px 0 4px; }
  input { width:100%; box-sizing:border-box; font-size:22px; padding:10px 12px; border-radius:10px; border:1px solid #33405a; background:#0e131c; color:var(--text); }
  #code { letter-spacing:8px; text-align:center; font-weight:700; }
  button { font:600 16px system-ui; border:0; border-radius:10px; padding:12px 16px; background:var(--acc); color:#04121a; cursor:pointer; }
  button.ghost { background:#24324a; color:var(--text); }
  button:disabled { opacity:.45; }
  #go { width:100%; margin-top:18px; }
  #ov { position:fixed; inset:0; pointer-events:none; z-index:4; }
  #bar { position:absolute; left:12px; right:12px; bottom:14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; pointer-events:auto;
         background:rgba(11,13,18,.82); border:1px solid var(--line); border-radius:14px; padding:10px 12px; }
  #status { flex:1 1 100%; font-size:14px; line-height:1.35; }
  #status b { color:var(--acc); }
  #hint { position:absolute; left:0; right:0; top:18px; text-align:center; font-size:15px; text-shadow:0 1px 4px #000; display:none; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="join">
  <div class="card">
    <h1>Spatial<span>ED</span> student</h1>
    <p>Type the class code from the professor's screen. Your phone must be on the same Wi-Fi as the professor.</p>
    <label for="code">Class code</label>
    <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="0000">
    <label for="name">Your name</label>
    <input id="name" maxlength="24" autocomplete="nickname" placeholder="First name">
    <button id="go">Join the class</button>
    <p id="jmsg" style="margin-top:12px"></p>
  </div>
</div>
<div id="ov">
  <div id="hint">Point at the floor or a table, then tap to place the lesson</div>
  <div id="bar" class="hidden">
    <div id="status">Connecting…</div>
    <button id="arBtn" class="hidden">View in AR</button>
    <button id="placeBtn" class="ghost hidden">Place again</button>
    <button id="exitBtn" class="ghost hidden">Exit AR</button>
    <button id="leaveBtn" class="ghost">Leave</button>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
<script type="module" src="js/student.js"></script>
</body>
</html>
