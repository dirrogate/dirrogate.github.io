<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Dirrogram</title>
<!-- Audience AR, Mode 1 "Hologram" (audience-ar-plan.md). Phase A: the page on its own, no relay, no Quest. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #e8ecf2; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* #433 selfie: no mirror. Text on the LED wall and the scroller reads the right way, and the screen matches the clip a recording saves */
  .hide { display: none !important; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(ellipse at 50% 35%, #1a1030 0%, #05040a 70%); text-align: center; padding: 24px; z-index: 5; }
  #start h1 { margin: 0; font-size: 44px; letter-spacing: 0.08em; font-weight: 800; }
  #start h1 .w { color: #fff; } #start h1 .r { color: #ff2a3c; }
  #start .sub { font-size: 15px; opacity: 0.75; max-width: 320px; line-height: 1.45; }
  .btn { appearance: none; border: 0; border-radius: 999px; padding: 14px 30px; font: 700 17px system-ui, sans-serif; letter-spacing: 0.06em;
    color: #08090c; background: #39e6ff; box-shadow: 0 0 24px #39e6ff88; cursor: pointer; }
  .btn.ghost { background: rgba(10, 12, 18, 0.62); color: #e8ecf2; box-shadow: none; border: 1px solid rgba(255,255,255,0.22); padding: 11px 18px; font-size: 14px; }
  #err { color: #ff8a8a; font-size: 13px; max-width: 320px; }
  #aim { position: fixed; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border: 2px solid #39e6ff; border-radius: 50%;
    box-shadow: 0 0 12px #39e6ff; pointer-events: none; z-index: 3; }
  #aim::after { content: ''; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #39e6ff; }
  #hint { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 18px); text-align: center; font-size: 15px; z-index: 3;
    text-shadow: 0 1px 4px #000; padding: 0 20px; }
  #bar { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 16px); display: flex; gap: 10px; justify-content: center; z-index: 4; flex-wrap: wrap; padding: 0 12px; }
  #panel { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 76px); max-width: 420px; margin: 0 auto; z-index: 4;
    background: rgba(8, 10, 16, 0.86); border: 1px solid rgba(255,255,255,0.14); border-radius: 16px; padding: 12px 14px; font-size: 14px;
    max-height: 60vh; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row .lab { flex: 1; opacity: 0.85; }
  .row .val { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
  .row button { width: 38px; height: 34px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: #141824; color: #e8ecf2; font-size: 18px; }
  .row input[type=text] { flex: 2; min-width: 0; background: #141824; color: #e8ecf2; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 8px; font-size: 14px; }
  #net { position: fixed; right: calc(env(safe-area-inset-right) + 12px); top: calc(env(safe-area-inset-top) + 12px); z-index: 4; font: 700 12px system-ui, sans-serif; letter-spacing: 0.06em;
    padding: 6px 10px; border-radius: 999px; background: rgba(8,10,16,0.7); color: #9aa4b8; border: 1px solid rgba(255,255,255,0.15); pointer-events: none; }
  #net.on { color: #39e6ff; border-color: #39e6ff88; }
  #sms { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 76px); max-width: 420px; margin: 0 auto; z-index: 5;
    background: rgba(8, 10, 16, 0.92); border: 1px solid #39e6ff66; border-radius: 16px; padding: 12px 14px; }
  #sms .smsT { font-weight: 700; letter-spacing: 0.06em; color: #39e6ff; margin-bottom: 8px; }
  #sms textarea { width: 100%; box-sizing: border-box; background: #141824; color: #e8ecf2; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 10px; font: 16px system-ui, sans-serif; resize: none; user-select: text; -webkit-user-select: text; touch-action: auto; }
  #sms .smsRow { display: flex; align-items: center; gap: 8px; margin-top: 8px; } #sms .smsRow span { flex: 1; opacity: 0.7; font-size: 13px; }
  #sms .btn { padding: 10px 18px; font-size: 14px; }
  #toast { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 8px 14px; border-radius: 10px; font-size: 14px; z-index: 6; pointer-events: none; transition: opacity 0.4s; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="start">
  <h1><span class="w">CLY</span><span class="r">3DJ</span></h1>
  <div class="sub">The Dirrogram: lasers, DIRRODJ and the LED wall over your camera. Point it at the booth.</div>
  <button class="btn" id="go">START</button>
  <div id="err"></div>
</div>
<div id="aim" class="hide"></div>
<div id="hint" class="hide">Point the ring at the centre DJ, then tap AIM</div>
<div id="bar" class="hide">
  <button class="btn ghost" id="bAim">AIM</button>
  <button class="btn ghost" id="bFlip">SELFIE</button>
  <button class="btn ghost" id="bPeople">PEOPLE</button>
  <button class="btn ghost" id="bSms">HOLO SMS</button>
  <button class="btn ghost" id="bSet">SETTINGS</button>
</div>
<div id="panel" class="hide"></div>
<div id="sms" class="hide">
  <div class="smsT">HoloSMS to the DJ</div>
  <textarea id="smsIn" maxlength="140" rows="3" placeholder="Your message for the hologram scroller (the DJ picks which ones go up)"></textarea>
  <div class="smsRow"><span id="smsN">0 / 140</span><button class="btn ghost" id="smsCancel">CANCEL</button><button class="btn" id="smsSend">SEND</button></div>
</div>
<div id="net" class="hide"></div>
<div id="toast" style="opacity:0"></div>
<script type="module" src="./js/dirrogram.js"></script>
</body>
</html>
