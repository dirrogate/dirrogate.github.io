<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Holodancer 4-view depth</title>
<style>
:root{ --bg:#06070c; --panel:#12141c; --line:#2a2e3c; --fg:#e9ecf3; --dim:#8d94a6; --cue:#35d6ff; --amb:#ffa24a; color-scheme:dark; }
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
canvas{display:block;position:relative;z-index:1}
#camv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none}
body.cam #camv{display:block}
body.cam{background:#000}
#ui{position:fixed;z-index:3;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px max(16px,env(safe-area-inset-left));background:color-mix(in srgb,var(--panel) 90%,transparent);border-top:1px solid var(--line)}
body.cam #ui{display:none}
button{font:600 13px system-ui,sans-serif;color:var(--fg);background:#1a1e2a;border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
button.go{border-color:var(--cue);color:var(--cue)}
button[aria-pressed="true"]{border-color:var(--amb);color:var(--amb)}
label{color:var(--dim);font-size:12px;display:flex;gap:6px;align-items:center}
input[type=range]{width:90px;accent-color:var(--cue)}
#read{font:12px ui-monospace,monospace;color:var(--dim);font-variant-numeric:tabular-nums}
#ov{position:fixed;inset:0;z-index:2;pointer-events:none;touch-action:none}
#ov.xr,body.cam #ov{pointer-events:auto}
#ov .tag{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;font:12px ui-monospace,monospace;color:#cfd6e4;background:rgba(6,7,12,.45);padding:4px 8px;border-radius:6px}
#hint{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);font:600 15px system-ui,sans-serif;color:#fff;background:rgba(6,7,12,.6);padding:10px 16px;border-radius:20px;white-space:nowrap;display:none}
#ov.xr #hint,body.cam #hint{display:block}
#xrBar{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:none;justify-content:center;gap:8px;flex-wrap:wrap}
#ov.xr #xrBar,body.cam #xrBar{display:flex}
</style>
<video id="camv" muted playsinline autoplay></video>
<div id="ui">
  <button id="ar" class="go">Start AR</button>
  <button id="play">Pause</button>
  <button id="room" aria-pressed="false">Room light</button>
  <button id="tear" aria-pressed="true">Holo tears</button>
  <button id="dbg" aria-pressed="false">Tint views</button>
  <label>Tear at (m) <input id="cut" type="range" min="0.01" max="0.25" step="0.01" value="0.06"></label>
  <label>Graze cut <input id="gr" type="range" min="0" max="0.6" step="0.05" value="0.15"></label>
  <span id="read">loading…</span>
</div>
<div id="ov"><span class="tag" id="tag"></span><span id="hint">Point at the floor, tap to place her</span>
  <div id="xrBar"><button id="xrRoom" aria-pressed="false">Room light</button><button id="xrTear" aria-pressed="true">Holo tears</button><button id="xrExit">Exit</button></div></div>
<video id="vid" muted loop playsinline crossorigin="anonymous" preload="auto" style="display:none"></video>

<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js"}}</script>
<script type="module">
// Holodancer 4-view depth: one 1920x1080 H.264. Top row = colour of views 0..3 (front, her left, back, her right),
// premultiplied over black, 480x540 each. Bottom row = depth of the same views (0 = empty, 0.1..1 = far..near).
// Each view becomes a grid mesh pushed out along its camera rays. The three cameras facing you are drawn,
// the best one dithered against the next near the 45 degree hand-over so the seam crossfades.
// Torn geometry (depth jumps, edge-on surfaces) is not just dropped: a second pass draws it as cyan scan lines.
// Room light: the phone's light estimate relights her using normals taken from the depth shells.
// No WebXR (iPhone Safari): camera mode, rear camera behind her, phone gyro turns the view.
import * as THREE from 'three';
import {OrbitControls} from '../vendor/three/OrbitControls.js';

const Q = new URLSearchParams(location.search);
const SRC = Q.get('v') || 'holo/kitana_holo4.mp4';
const MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

const DIST = 4.4, CH = 1.0, ZN = +(Q.get('zn') || 3.7), ZF = +(Q.get('zf') || 5.1);
const TV = 12 / 50, TH = TV * 480 / 540;
const HEIGHT = 1.72, START_SCALE = 1.524 / HEIGHT;
const GRID = (Q.get('g') || (MOBILE ? '96x108' : '160x180')).split('x').map(Number);
const XR_SCALE = +(Q.get('fs') || 0.6);   // AR framebuffer scale: full phone resolution costs far more than it shows

const vid = document.getElementById('vid');
const renderer = new THREE.WebGLRenderer({ antialias: !MOBILE, alpha: true });

const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 100); cam.position.set(0, 1.4, 3.6);

const grid = new THREE.GridHelper(10, 20, 0x2a3346, 0x161b26); scene.add(grid);

const shared = {
  uCut: { value: 0.06 }, uGraze: { value: 0.15 }, uTint: { value: 0 }, uT: { value: 0 },
  uRoom: { value: 0 }, uAmb: { value: new THREE.Vector3(0.6, 0.6, 0.6) }, uKey: { value: new THREE.Vector3(0.6, 0.6, 0.6) }, uL: { value: new THREE.Vector3(0, 1, 0) },
};
// Per grid point (not per screen pixel): depth jump to the neighbouring grid points in metres = tear,
// and a smooth normal from those neighbours (per-pixel derivatives gave flat tiles under Room light).
const VS = `
  uniform sampler2D map; uniform float uView, uZn, uZf, uTh, uTv; uniform vec2 uStep;
  varying vec2 vUv; varying float vZ, vOcc, vJump; varying vec3 vPos, vN;
  float dep(vec2 p){ return texture2D(map, vec2((uView + clamp(p.x, 0.001, 0.999)) * 0.25, clamp(p.y, 0.001, 0.999) * 0.5)).r; }
  float zOf(float s){ return mix(uZf, uZn, clamp((s - 0.1) / 0.9, 0.0, 1.0)); }
  vec3 P(vec2 p, float z){ return vec3((p.x * 2.0 - 1.0) * uTh * z, (p.y * 2.0 - 1.0) * uTv * z, -z); }
  void main(){
    vUv = uv;
    float s = dep(uv);
    vec2 e = vec2(2.0 / 480.0, 2.0 / 540.0);   // erode the outline: compression smears depth into the empty border
    float mn = min(min(dep(uv + vec2(e.x, 0.0)), dep(uv - vec2(e.x, 0.0))), min(dep(uv + vec2(0.0, e.y)), dep(uv - vec2(0.0, e.y))));
    vOcc = step(0.06, s) * step(0.06, mn);
    float z = vOcc > 0.5 ? zOf(s) : uZf;
    vec2 dx = vec2(uStep.x, 0.0), dy = vec2(0.0, uStep.y);
    float sL = dep(uv - dx), sR = dep(uv + dx), sD = dep(uv - dy), sU = dep(uv + dy);
    float zL = sL > 0.06 ? zOf(sL) : z, zR = sR > 0.06 ? zOf(sR) : z, zD = sD > 0.06 ? zOf(sD) : z, zU = sU > 0.06 ? zOf(sU) : z;
    vJump = max(max(abs(zL - z), abs(zR - z)), max(abs(zD - z), abs(zU - z)));
    vec3 n = normalize(cross(P(uv + dx, zR) - P(uv - dx, zL), P(uv + dy, zU) - P(uv - dy, zD)));
    vN = normalize(normalMatrix * n);
    vZ = z;
    vec4 mv = modelViewMatrix * vec4(P(uv, z), 1.0); vPos = mv.xyz;
    gl_Position = projectionMatrix * mv;
  }`;
const COMMON = `
  uniform sampler2D map; uniform float uView, uCut, uGraze, uTint, uT, uKeep, uRoom; uniform vec3 uAmb, uKey, uL;
  varying vec2 vUv; varying float vZ, vOcc, vJump; varying vec3 vPos, vN;
  vec3 col(){ vec2 p = clamp(vUv, 0.002, 0.998); return texture2D(map, vec2((uView + p.x) * 0.25, 0.5 + p.y * 0.5)).rgb; }
  float occ(){ vec2 p = clamp(vUv, 0.002, 0.998); return texture2D(map, vec2((uView + p.x) * 0.25, p.y * 0.5)).r; }
  vec3 nrm(){ vec3 n = normalize(vN); return dot(n, -vPos) < 0.0 ? -n : n; }
  float torn(vec3 n){ return max(step(uCut, vJump), step(abs(dot(n, normalize(-vPos))), uGraze)); }
  float b2(vec2 a){ a = floor(a); return fract(dot(a, vec2(0.5, a.y * 0.75))); }
  float bayer(vec2 a){ return b2(0.5 * a) * 0.25 + b2(a) + 0.03; }   // 4x4 ordered dither, 0..1`;
const FS = COMMON + `
  void main(){
    if (vOcc < 0.999 || occ() < 0.06) discard;
    vec3 n = nrm();
    if (torn(n) > 0.5) discard;
    if (bayer(gl_FragCoord.xy) > uKeep) discard;          // crossfade with the next view near the hand-over
    vec3 c = col();
    vec3 lit = uAmb + uKey * max(dot(n, normalize(uL)), 0.0);
    c = mix(c, c * lit * 1.25, uRoom);
    vec3 tint = uView < 0.5 ? vec3(1.0, 0.3, 0.3) : uView < 1.5 ? vec3(0.3, 1.0, 0.3) : uView < 2.5 ? vec3(0.3, 0.5, 1.0) : vec3(1.0, 1.0, 0.3);
    gl_FragColor = vec4(mix(c, c * 0.4 + tint * 0.4, uTint), 1.0);
  }`;
const FS_TEAR = COMMON + `
  void main(){
    if (vOcc < 0.999 || occ() < 0.06) discard;
    vec3 n = nrm();
    if (torn(n) < 0.5) discard;                           // only the torn bits
      float scan = step(0.55, fract(gl_FragCoord.y * 0.2 - uT * 5.0));
      float flick = 0.65 + 0.35 * sin(uT * 37.0 + vZ * 40.0);
      float inner = 1.0 - step(0.35, vJump);   // #576 a gap between her own parts (arm over torso): solid dark fill, so AR shows no holes
      vec3 line = mix(col(), vec3(0.15, 0.8, 1.0), 0.8) * flick;
      float a = max(inner, scan * 0.85);
      if (a < 0.01) discard;

const views = [];
const geo = new THREE.PlaneGeometry(1, 1, GRID[0], GRID[1]);
for (let v = 0; v < 4; v++) {
  const un = { map: { value: tex }, uView: { value: v }, uZn: { value: ZN }, uZf: { value: ZF }, uTh: { value: TH }, uTv: { value: TV }, uKeep: { value: 1 }, uStep: { value: new THREE.Vector2(1 / GRID[0], 1 / GRID[1]) }, ...shared };
  const m = new THREE.ShaderMaterial({ uniforms: un, vertexShader: VS, fragmentShader: FS, polygonOffset: true });
  const mt = new THREE.ShaderMaterial({ uniforms: un, vertexShader: VS, fragmentShader: FS_TEAR, transparent: true, depthWrite: false });

  const mesh = new THREE.Mesh(geo, m), tear = new THREE.Mesh(geo, mt);
  mesh.frustumCulled = tear.frustumCulled = false; tear.renderOrder = 2;
  const az = (-90 - 90 * v) * Math.PI / 180;   // camera v: Blender azimuth -90 - 90v (her front faces three +Z)
  const pivot = new THREE.Camera();            // a camera's lookAt points -Z at the target, matching the shader
  pivot.position.set(DIST * Math.cos(az), CH, -DIST * Math.sin(az)); pivot.lookAt(0, CH, 0);
  pivot.add(mesh, tear); holo.add(pivot);

}
let tears = true, room = false;
function setTear(on) { tears = on; for (const id of ['tear', 'xrTear']) document.getElementById(id).setAttribute('aria-pressed', on); }
function setRoom(on) { room = on; shared.uRoom.value = on ? 1 : 0; for (const id of ['room', 'xrRoom']) document.getElementById(id).setAttribute('aria-pressed', on); }
for (const id of ['tear', 'xrTear']) document.getElementById(id).onclick = () => setTear(!tears);
for (const id of ['room', 'xrRoom']) document.getElementById(id).onclick = () => setRoom(!room);

// ---------- touch: tap place, pinch scale, twist turn (AR); drag turn / nearer-farther, pinch scale (camera mode) ----------
let session = null, hitSrc = null, placed = false, lightProbeXR = null, est = null, camMode = false;
const ov = document.getElementById('ov'), hint = document.getElementById('hint');
const reticle = new THREE.Group(); reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);
{ const rm = new THREE.MeshBasicMaterial({ color: 0x35d6ff, transparent: true, opacity: 0.9, depthWrite: false, side: THREE.DoubleSide });
  const r1 = new THREE.Mesh(new THREE.RingGeometry(0.16, 0.19, 48), rm); r1.rotation.x = -Math.PI / 2; reticle.add(r1);
  const ar = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.08, 3), rm); ar.rotation.x = Math.PI / 2; ar.position.set(0, 0.001, 0.25); reticle.add(ar); }
const retPos = new THREE.Vector3(), retQ = new THREE.Quaternion(), retS = new THREE.Vector3(), tmp = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
function placeAtReticle() { if (!reticle.visible) return; holo.position.copy(retPos); renderer.xr.getCamera().getWorldPosition(tmp); holo.rotation.y = Math.atan2(tmp.x - retPos.x, tmp.z - retPos.z); placed = true; holo.visible = true; hint.textContent = 'Pinch to scale · twist to turn · tap to move'; }
const touches = new Map(); let pinch0 = null, drag0 = null, tapT = 0, tapMoved = false;
function two() { const [a, b] = [...touches.values()]; return { d: Math.hypot(b.x - a.x, b.y - a.y), ang: Math.atan2(b.y - a.y, b.x - a.x) }; }
ov.addEventListener('beforexrselect', (e) => e.preventDefault());
ov.addEventListener('pointerdown', (e) => {
  if (e.target.closest('button')) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 1) { tapT = performance.now(); tapMoved = false; drag0 = { x: e.clientX, y: e.clientY, r: holo.rotation.y, z: holo.position.z }; }
  if (touches.size === 2) { const t = two(); pinch0 = { d: t.d, ang: t.ang, s: holo.scale.x, r: holo.rotation.y }; tapMoved = true; }
});

  const p = touches.get(e.pointerId); if (!p) return;
  if (Math.hypot(e.clientX - p.x, e.clientY - p.y) > 12 && touches.size === 1) tapMoved = true;
  p.x = e.clientX; p.y = e.clientY;
  if (touches.size === 2 && pinch0 && (placed || camMode)) { const t = two(); holo.scale.setScalar(THREE.MathUtils.clamp(pinch0.s * t.d / pinch0.d, 0.1, 1.6)); holo.rotation.y = pinch0.r - (t.ang - pinch0.ang); }
  if (touches.size === 1 && camMode && drag0) { holo.rotation.y = drag0.r + (p.x - drag0.x) * 0.01; holo.position.z = THREE.MathUtils.clamp(drag0.z + (p.y - drag0.y) * 0.01, -6, -1.2); }
});

ov.addEventListener('pointerup', up); ov.addEventListener('pointercancel', up);
document.getElementById('xrExit').onclick = () => { if (session) session.end(); else if (camMode) stopCam(); };

// ---------- camera mode (iPhone Safari and anything without WebXR AR): rear camera + gyro ----------
const camv = document.getElementById('camv'); let camStream = null, alpha0 = null; const ori = { a: 0, b: 90, g: 0, ok: false };
function onOri(e) { if (e.alpha == null) return; ori.a = e.alpha; ori.b = e.beta; ori.g = e.gamma; ori.ok = true; if (alpha0 == null) alpha0 = e.alpha; }
async function startCam() {
  try { if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); } catch (e) {}
  addEventListener('deviceorientation', onOri);
  try { camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }); camv.srcObject = camStream; await camv.play(); } catch (e) { read.textContent = 'Camera blocked: ' + e.message; }

  scene.background = null; grid.visible = false; orbit.enabled = false;
  cam.fov = 62; cam.position.set(0, 1.4, 0); cam.updateProjectionMatrix();
  holo.position.set(0, 0, -2.6); holo.rotation.y = 0; holo.visible = true;
  hint.textContent = 'Drag to turn her / move her · pinch to scale';

  if (camStream) camStream.getTracks().forEach((t) => t.stop()); camStream = null;

  cam.fov = 45; cam.position.set(0, 1.4, 3.6); cam.quaternion.identity(); cam.updateProjectionMatrix(); orbit.update();
  holo.position.set(0, 0, 0); holo.rotation.y = 0; holo.scale.setScalar(START_SCALE);

const E = new THREE.Euler(), q0 = new THREE.Quaternion(), q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)), ZEE = new THREE.Vector3(0, 0, 1);

document.getElementById('ar').onclick = async () => {
  vid.play().catch(() => {});
  if (session) { session.end(); return; }
  const hasAR = navigator.xr && await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);

};

// ---------- UI ----------
const read = document.getElementById('read');
document.getElementById('play').onclick = (e) => { if (vid.paused) { vid.play(); e.target.textContent = 'Pause'; } else { vid.pause(); e.target.textContent = 'Play'; } };
document.getElementById('dbg').onclick = (e) => { shared.uTint.value = shared.uTint.value ? 0 : 1; e.target.setAttribute('aria-pressed', !!shared.uTint.value); };
document.getElementById('cut').oninput = (e) => { shared.uCut.value = +e.target.value; };
document.getElementById('gr').oninput = (e) => { shared.uGraze.value = +e.target.value; };
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
vid.addEventListener('loadedmetadata', () => { read.textContent = `${vid.src.split('/').pop()} ${vid.videoWidth}x${vid.videoHeight} ${vid.duration.toFixed(1)} s · grid ${GRID.join('x')}`; });
vid.src = SRC; vid.load(); vid.play().catch(() => { read.textContent = 'tap Play to start'; });

// ---------- loop ----------
const eye = new THREE.Vector3(), local = new THREE.Vector3(), Lw = new THREE.Vector3(), clock = new THREE.Clock(); let fpsN = 0, fpsT = 0, fps = 0;
renderer.setAnimationLoop((t, frame) => {

  const viewer = renderer.xr.isPresenting ? renderer.xr.getCamera() : cam;

    if (!placed) { holo.visible = reticle.visible; if (reticle.visible) { holo.position.copy(retPos); holo.rotation.y = Math.atan2(eye.x - retPos.x, eye.z - retPos.z); } }

      shared.uKey.value.set(I.x, I.y, I.z).multiplyScalar(0.35).clampScalar(0, 1.5);
