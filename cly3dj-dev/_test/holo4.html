<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Holodancer 4-view depth</title>
<style>
:root{ --bg:#06070c; --panel:#12141c; --line:#2a2e3c; --fg:#e9ecf3; --dim:#8d94a6; --cue:#35d6ff; --amb:#ffa24a; color-scheme:dark; }
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
canvas{display:block}
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px max(16px,env(safe-area-inset-left));background:color-mix(in srgb,var(--panel) 90%,transparent);border-top:1px solid var(--line)}
button{font:600 13px system-ui,sans-serif;color:var(--fg);background:#1a1e2a;border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
button.go{border-color:var(--cue);color:var(--cue)}
button[aria-pressed="true"]{border-color:var(--amb);color:var(--amb)}
label{color:var(--dim);font-size:12px;display:flex;gap:6px;align-items:center}
input[type=range]{width:100px;accent-color:var(--cue)}
#read{font:12px ui-monospace,monospace;color:var(--dim);font-variant-numeric:tabular-nums}
#ov{position:fixed;inset:0;pointer-events:none;touch-action:none}
#ov.xr{pointer-events:auto}
#ov .tag{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;font:12px ui-monospace,monospace;color:#cfd6e4;background:rgba(6,7,12,.45);padding:4px 8px;border-radius:6px}
#hint{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);font:600 15px system-ui,sans-serif;color:#fff;background:rgba(6,7,12,.6);padding:10px 16px;border-radius:20px;white-space:nowrap;display:none}
#ov.xr #hint{display:block}
#xrBar{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:none;justify-content:center;gap:8px}
#ov.xr #xrBar{display:flex}
</style>
<div id="ui">
  <button id="ar" class="go">Start AR</button>
  <button id="play">Pause</button>
  <button id="dbg" aria-pressed="false">Tint views</button>
  <label>Edge cut <input id="cut" type="range" min="0.005" max="0.1" step="0.005" value="0.05"></label>
  <label>Graze cut <input id="gr" type="range" min="0" max="0.8" step="0.05" value="0.2"></label>
  <span id="read">loading…</span>
</div>
<div id="ov"><span class="tag" id="tag"></span><span id="hint">Point at the floor, tap to place her</span><div id="xrBar"><button id="xrExit">Exit</button></div></div>
<video id="vid" muted loop playsinline crossorigin="anonymous" preload="auto" style="display:none"></video>

<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js"}}</script>
<script type="module">
// Holodancer 4-view depth: one 1920x1080 H.264. Top row = colour of views 0..3 (front, her left, back, her right),
// premultiplied over black, 480x540 each. Bottom row = depth of the same views (0 = empty, 0.1..1 = far..near).
// Each view becomes a grid mesh pushed out along its camera rays; the views nearest the viewer win.
import * as THREE from 'three';
import {OrbitControls} from '../vendor/three/OrbitControls.js';

const Q = new URLSearchParams(location.search);
const SRC = Q.get('v') || 'holo/kitana_holo4.mp4';
// Blender rig: 50 mm lens, 24 mm vertical sensor, 4.4 m away, 1.0 m up, slot 480x540; depth encoded over 3.7..5.1 m
const DIST = 4.4, CH = 1.0, ZN = +(Q.get('zn') || 3.7), ZF = +(Q.get('zf') || 5.1);
const TV = 12 / 50, TH = TV * 480 / 540;   // tan(half fov) vertical / horizontal
const HEIGHT = 1.72, START_SCALE = 1.524 / HEIGHT;

const vid = document.getElementById('vid');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); const BG = new THREE.Color(0x06070c); scene.background = BG;
const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 100); cam.position.set(0, 1.4, 3.6);
const orbit = new OrbitControls(cam, renderer.domElement); orbit.target.set(0, 0.95, 0); orbit.enableDamping = true; orbit.update();
const grid = new THREE.GridHelper(10, 20, 0x2a3346, 0x161b26); scene.add(grid);

const tex = new THREE.VideoTexture(vid);
tex.colorSpace = THREE.NoColorSpace; tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter; tex.generateMipmaps = false;

const holo = new THREE.Group(); holo.scale.setScalar(START_SCALE); scene.add(holo);
const shared = { uCut: { value: 0.05 }, uTint: { value: 0 }, uOp: { value: 1 }, uGraze: { value: 0.2 } };
const VS = `
  uniform sampler2D map; uniform float uView, uZn, uZf, uTh, uTv;
  varying vec2 vUv; varying float vZ, vOcc; varying vec3 vPos;
  float dep(vec2 p){ return texture2D(map, vec2((uView + p.x) * 0.25, p.y * 0.5)).r; }
  void main(){
    vUv = uv;
    float s = dep(uv);
    // erode the outline by ~2 texels: compression smears depth into the empty border
    vec2 e = vec2(2.0 / 480.0, 2.0 / 540.0);
    float mn = min(min(dep(uv + vec2(e.x, 0.0)), dep(uv - vec2(e.x, 0.0))), min(dep(uv + vec2(0.0, e.y)), dep(uv - vec2(0.0, e.y))));
    vOcc = step(0.06, s) * step(0.06, mn);
    float d = clamp((s - 0.1) / 0.9, 0.0, 1.0);
    float z = mix(uZf, uZn, d);              // distance along the camera axis
    if (vOcc < 0.5) z = uZf;
    vZ = z;
    vec3 p = vec3((uv.x * 2.0 - 1.0) * uTh * z, (uv.y * 2.0 - 1.0) * uTv * z, -z);
    vec4 mv = modelViewMatrix * vec4(p, 1.0); vPos = mv.xyz;
    gl_Position = projectionMatrix * mv;
  }`;
const FS = `
  uniform sampler2D map; uniform float uView, uCut, uTint, uOp, uGraze;
  varying vec2 vUv; varying float vZ, vOcc; varying vec3 vPos;
  void main(){
    if (vOcc < 0.999) discard;                           // a triangle touching empty space
    if (fwidth(vZ) > uCut * 10.0) discard;               // a triangle stretched across a depth jump
    vec3 n = normalize(cross(dFdx(vPos), dFdy(vPos)));
    if (abs(dot(n, normalize(-vPos))) < uGraze) discard; // seen edge-on from here: another camera has this part face-on
    vec2 p = clamp(vUv, 0.002, 0.998);
    float s = texture2D(map, vec2((uView + p.x) * 0.25, p.y * 0.5)).r;
    if (s < 0.06) discard;
    vec3 c = texture2D(map, vec2((uView + p.x) * 0.25, 0.5 + p.y * 0.5)).rgb;
    vec3 tint = uView < 0.5 ? vec3(1.0, 0.3, 0.3) : uView < 1.5 ? vec3(0.3, 1.0, 0.3) : uView < 2.5 ? vec3(0.3, 0.5, 1.0) : vec3(1.0, 1.0, 0.3);
    c = mix(c, c * 0.4 + tint * 0.4, uTint);
    gl_FragColor = vec4(c, uOp);
  }`;
const views = [];
const geo = new THREE.PlaneGeometry(1, 1, 160, 180);
for (let v = 0; v < 4; v++) {
  const m = new THREE.ShaderMaterial({
    uniforms: { map: { value: tex }, uView: { value: v }, uZn: { value: ZN }, uZf: { value: ZF }, uTh: { value: TH }, uTv: { value: TV }, ...shared },
    vertexShader: VS, fragmentShader: FS, transparent: false, polygonOffset: true,
  });
  m.extensions = { derivatives: true };
  const mesh = new THREE.Mesh(geo, m); mesh.frustumCulled = false;
  // camera v sits at Blender azimuth -90 - 90v around her centre (her front faces Blender -Y = three +Z)
  const az = (-90 - 90 * v) * Math.PI / 180;
  const pivot = new THREE.Camera();   // a camera's lookAt points -Z at the target, matching the shader's camera space
  pivot.position.set(DIST * Math.cos(az), CH, -DIST * Math.sin(az));
  pivot.lookAt(0, CH, 0);
  pivot.add(mesh); holo.add(pivot);
  views.push({ v, mesh, mat: m, dir: new THREE.Vector3(Math.cos(az), 0, -Math.sin(az)) });
}

// ---------- AR (same controls as holo.html) ----------
let session = null, hitSrc = null, placed = false;
const ov = document.getElementById('ov'), hint = document.getElementById('hint');
const reticle = new THREE.Group(); reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);
{ const rm = new THREE.MeshBasicMaterial({ color: 0x35d6ff, transparent: true, opacity: 0.9, depthWrite: false, side: THREE.DoubleSide });
  const r1 = new THREE.Mesh(new THREE.RingGeometry(0.16, 0.19, 48), rm); r1.rotation.x = -Math.PI / 2; reticle.add(r1);
  const ar = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.08, 3), rm); ar.rotation.x = Math.PI / 2; ar.position.set(0, 0.001, 0.25); reticle.add(ar); }
const retPos = new THREE.Vector3(), retQ = new THREE.Quaternion(), retS = new THREE.Vector3(), tmp = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
function placeAtReticle() { if (!reticle.visible) return; holo.position.copy(retPos); renderer.xr.getCamera().getWorldPosition(tmp); holo.rotation.y = Math.atan2(tmp.x - retPos.x, tmp.z - retPos.z); placed = true; holo.visible = true; hint.textContent = 'Pinch to scale · twist to turn · tap to move'; }
const touches = new Map(); let pinch0 = null, tapT = 0, tapMoved = false;
function two() { const [a, b] = [...touches.values()]; return { d: Math.hypot(b.x - a.x, b.y - a.y), ang: Math.atan2(b.y - a.y, b.x - a.x) }; }
ov.addEventListener('beforexrselect', (e) => e.preventDefault());
ov.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) return; touches.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (touches.size === 1) { tapT = performance.now(); tapMoved = false; } if (touches.size === 2) { const t = two(); pinch0 = { d: t.d, ang: t.ang, s: holo.scale.x, r: holo.rotation.y }; tapMoved = true; } });
ov.addEventListener('pointermove', (e) => { const p = touches.get(e.pointerId); if (!p) return; if (Math.hypot(e.clientX - p.x, e.clientY - p.y) > 12 && touches.size === 1) tapMoved = true; p.x = e.clientX; p.y = e.clientY; if (touches.size === 2 && pinch0 && placed) { const t = two(); holo.scale.setScalar(THREE.MathUtils.clamp(pinch0.s * t.d / pinch0.d, 0.1, 1.6)); holo.rotation.y = pinch0.r - (t.ang - pinch0.ang); } });
function up(e) { if (!touches.has(e.pointerId)) return; touches.delete(e.pointerId); if (touches.size < 2) pinch0 = null; if (touches.size === 0 && !tapMoved && performance.now() - tapT < 350) placeAtReticle(); }
ov.addEventListener('pointerup', up); ov.addEventListener('pointercancel', up);
document.getElementById('xrExit').onclick = () => session && session.end();
document.getElementById('ar').onclick = async () => {
  vid.play().catch(() => {});
  if (session) { session.end(); return; }
  if (!navigator.xr || !(await navigator.xr.isSessionSupported('immersive-ar'))) { read.textContent = 'No AR here. Desktop: drag to walk around her.'; return; }
  session = await navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay'], domOverlay: { root: ov } });
  renderer.xr.setReferenceSpaceType('local'); await renderer.xr.setSession(session);
  hitSrc = await session.requestHitTestSource({ space: await session.requestReferenceSpace('viewer') });
  scene.background = null; grid.visible = false; holo.visible = false; placed = false; ov.classList.add('xr');
  session.addEventListener('end', () => { session = null; hitSrc = null; reticle.visible = false; holo.visible = true; placed = false; holo.position.set(0, 0, 0); holo.rotation.y = 0; holo.scale.setScalar(START_SCALE); scene.background = BG; grid.visible = true; ov.classList.remove('xr'); touches.clear(); });
};

// ---------- UI ----------
const read = document.getElementById('read');
document.getElementById('play').onclick = (e) => { if (vid.paused) { vid.play(); e.target.textContent = 'Pause'; } else { vid.pause(); e.target.textContent = 'Play'; } };
document.getElementById('dbg').onclick = (e) => { shared.uTint.value = shared.uTint.value ? 0 : 1; e.target.setAttribute('aria-pressed', !!shared.uTint.value); };
document.getElementById('cut').oninput = (e) => { shared.uCut.value = +e.target.value; };
document.getElementById('gr').oninput = (e) => { shared.uGraze.value = +e.target.value; };
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
vid.addEventListener('loadedmetadata', () => { read.textContent = `${vid.src.split('/').pop()} ${vid.videoWidth}x${vid.videoHeight} ${vid.duration.toFixed(1)} s`; });
vid.src = SRC; vid.load(); vid.play().catch(() => { read.textContent = 'tap Play to start'; });

// ---------- loop: rank the views by how directly each camera faces the viewer ----------
const eye = new THREE.Vector3(), local = new THREE.Vector3(), clock = new THREE.Clock(); let fpsN = 0, fpsT = 0, fps = 0;
renderer.setAnimationLoop((t, frame) => {
  const dt = clock.getDelta();
  const viewer = renderer.xr.isPresenting ? renderer.xr.getCamera() : cam;
  viewer.getWorldPosition(eye);
  if (!renderer.xr.isPresenting) orbit.update();
  if (frame && hitSrc) {
    const res = frame.getHitTestResults(hitSrc);
    if (res.length) { reticle.matrix.fromArray(res[0].getPose(renderer.xr.getReferenceSpace()).transform.matrix); reticle.matrix.decompose(retPos, retQ, retS); retQ.setFromAxisAngle(UP, Math.atan2(eye.x - retPos.x, eye.z - retPos.z)); reticle.matrix.compose(retPos, retQ, retS.set(1, 1, 1)); reticle.visible = true; } else reticle.visible = false;
    if (!placed) { holo.visible = reticle.visible; if (reticle.visible) { holo.position.copy(retPos); holo.rotation.y = Math.atan2(eye.x - retPos.x, eye.z - retPos.z); } }
  }
  holo.worldToLocal(local.copy(eye)); local.y = 0; local.normalize();
  const ranked = views.map((o) => ({ o, d: o.dir.dot(local) })).sort((a, b) => b.d - a.d);
  ranked.forEach(({ o, d }, i) => {
    o.mesh.visible = i < 2 || d > -0.2;                 // the camera opposite you is never needed
    o.mat.polygonOffsetFactor = -4 + i * 3; o.mat.polygonOffsetUnits = -40 + i * 30;   // best view wins where shells overlap
  });
  renderer.render(scene, cam);
  fpsN++; fpsT += dt; if (fpsT > 0.5) { fps = fpsN / fpsT; fpsN = 0; fpsT = 0; }
  document.getElementById('tag').textContent = `${fps.toFixed(0)} fps · best view ${ranked[0].o.v} then ${ranked[1].o.v}`;
});
window.__h4 = { views, shared, holo };
</script>
