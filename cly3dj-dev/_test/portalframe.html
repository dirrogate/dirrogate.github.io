<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal frame test</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;font:13px system-ui;color:#ddd}#ui{position:fixed;left:8px;bottom:8px;display:flex;gap:6px}button{background:#1a1e2a;color:#ddd;border:1px solid #333;border-radius:6px;padding:6px 10px}</style>
<div id="ui"><button id="sky">sky</button><button id="w">size</button><button id="door">type</button><button id="roof">skyroof</button><span id="kind" style="align-self:center"></span><button id="glow">light</button></div>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js"}}</script>
<script type="module">
// Test bench for js/portal.js: one frame in front of the DJ, the chosen skybox as the dome (cut by the portal), and a
// stand-in "real room" (light grey with a grid) seen through it. Never saves to vire.portals.
import * as THREE from 'three';
import { OrbitControls } from '../vendor/three/OrbitControls.js';
import { Portals } from '../js/portal.js';
const Q = new URLSearchParams(location.search);
const R = new THREE.WebGLRenderer({ antialias: true }); R.setPixelRatio(Math.min(devicePixelRatio, 1.5)); R.setSize(innerWidth, innerHeight); document.body.prepend(R.domElement);
R.toneMapping = THREE.ACESFilmicToneMapping; R.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xb9bcc0);
const grid = new THREE.GridHelper(20, 40, 0x777777, 0x999999); scene.add(grid);
const cam = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.02, 50); cam.position.set(0, 1.6, 1.2);
const orbit = new OrbitControls(cam, R.domElement); orbit.target.set(0, 1.3, -1.3); orbit.update();
const rig = new THREE.Group(); scene.add(rig);
const pm = new THREE.PMREMGenerator(R);
const skies = ['redcastle', 'spaceship']; let si = Q.get('sky') === 'spaceship' ? 1 : 0;
const domeMat = new THREE.MeshBasicMaterial({ side: THREE.BackSide });
const dome = new THREE.Mesh(new THREE.SphereGeometry(8, 64, 32), domeMat); dome.position.y = 1.6; scene.add(dome);
scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 0.6));
function loadSky() { new THREE.TextureLoader().load(`sky/${skies[si]}.jpg`, t => { t.mapping = THREE.EquirectangularReflectionMapping; t.colorSpace = THREE.SRGBColorSpace; domeMat.map = t; domeMat.needsUpdate = true; scene.environment = pm.fromEquirectangular(t).texture; }); }
loadSky();
const portals = new Portals(rig, () => ({ p: new THREE.Vector3(0, 1.3, -1.3), yaw: 0 }));
portals.save = () => {}; portals.list.forEach(f => { f.set = portals; });
const f = portals._frame(0); f.place({ p: new THREE.Vector3(0, 1.3, -1.3), yaw: 0 }); f.half.set(+(Q.get('hx') || 0.3), +(Q.get('hy') || 0.75)); f._fit();
portals.n = 1; portals.setOn(true, false); portals.cutInto(dome, { sky: true }); setTimeout(() => showKind && showKind(), 0);
const sizes = [[0.3, 0.75], [0.5, 1.05], [1.2, 0.6], [0.15, 0.2]]; let zi = 0;
document.getElementById('sky').onclick = () => { si = (si + 1) % 2; loadSky(); };
const kindEl = document.getElementById('kind'), showKind = () => { kindEl.textContent = portals.kindOf(0); };
document.getElementById('door').onclick = () => { portals.stepKind(0, 1); showKind(); };
document.getElementById('roof').onclick = () => { f.obj.position.set(0, 2.4, -0.6); f.obj.quaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2); f.half.set(0.6, 0.6); f._fit(); };
document.getElementById('glow').onclick = () => portals.stepGlow(1);
document.getElementById('w').onclick = () => { zi = (zi + 1) % sizes.length; f.half.set(...sizes[zi]); f._fit(); };
if (Q.get('kind')) portals.setKind(0, Q.get('kind')); showKind(); if (Q.get('glow')) { portals.glow = Q.get('glow'); portals._styles(); }
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); R.setSize(innerWidth, innerHeight); });
R.setAnimationLoop(() => { orbit.update(); portals.tick(); R.render(scene, cam); });
window.__pf = { f, cam, orbit, portals };
</script>
